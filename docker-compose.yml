version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  payment-service:
    build: ./payment-service
    container_name: payment-service
    depends_on:
      - postgres
      - rabbitmq
    environment:
      PAYMENT_DB_DSN: host=postgres port=5432 user=postgres password=postgres dbname=payment_db sslmode=disable
      PAYMENT_GRPC_ADDR: ":50051"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PAYMENT_EVENTS_QUEUE: payment.completed
    ports:
      - "50051:50051"

  order-service:
    build: ./order-service
    container_name: order-service
    depends_on:
      - postgres
      - payment-service
    environment:
      ORDER_DB_DSN: host=postgres port=5432 user=postgres password=postgres dbname=order_db sslmode=disable
      PAYMENT_GRPC_ADDR: payment-service:50051
      ORDER_GRPC_ADDR: ":50052"
      ORDER_HTTP_ADDR: ":8081"
    ports:
      - "8081:8081"
      - "50052:50052"

  notification-service:
    build: ./notification-service
    container_name: notification-service
    depends_on:
      - rabbitmq
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PAYMENT_EVENTS_QUEUE: payment.completed

